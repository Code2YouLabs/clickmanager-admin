<div class="d-flex justify-content-between align-items-center flex-wrap p-16 w-100">
  <div>
    <div class="f-s-20 f-w-600 text-primary-dark">
      {{ titulo }}
    </div>
    @if (subtitulo) {
      <div class="f-s-13 text-muted">
        {{ subtitulo }}
      </div>
    }
  </div>

  <div class="d-flex align-items-center gap-8 flex-wrap">
    <!-- Botão de ajuda -->
    @if (helpRota) {
      @if (helpExterno) {
        <a
          mat-icon-button
          class="help-icon-btn"
          [href]="helpRota"
          target="_blank"
          rel="noopener"
          [matTooltip]="helpTexto || 'Ajuda'"
          [attr.aria-label]="helpTexto || 'Ajuda'"
          >
          <mat-icon>{{ helpIcone }}</mat-icon>
        </a>
      } @else {
        <a
          mat-icon-button
          class="help-icon-btn"
          [routerLink]="helpRota"
          [fragment]="helpFragment"
          [matTooltip]="helpTexto || 'Ajuda'"
          [attr.aria-label]="helpTexto || 'Ajuda'"
          >
          <mat-icon>{{ helpIcone }}</mat-icon>
        </a>
      }
    }

    <!-- Botão de ação -->
    @if (botaoTexto && botaoRota) {
      @if (!permissao) {
        <button mat-stroked-button [color]="botaoCor" [routerLink]="botaoRota">
          <mat-icon class="m-r-4">{{ botaoIcone }}</mat-icon>
          {{ botaoTexto }}
        </button>
      } @else {
        <button mat-stroked-button [color]="botaoCor" [routerLink]="botaoRota" *temPermissao="permissao">
          <mat-icon class="m-r-4">{{ botaoIcone }}</mat-icon>
          {{ botaoTexto }}
        </button>
      }
    }
  </div>
</div>

@if (mostrarDivisor) {
  <mat-divider class="m-b-24"></mat-divider>
}
