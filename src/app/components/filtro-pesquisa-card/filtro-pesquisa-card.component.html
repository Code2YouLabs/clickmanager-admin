<app-section-card [titulo]="titulo" [divider]="true">
  <div class="filters">
    <app-input-pesquisa
      [placeholder]="placeholder"
      [showLabel]="false"
      (valorAlterado)="onPesquisar($event)">
    </app-input-pesquisa>

    @if (mostrarStatus) {
      <mat-form-field appearance="outline" class="status-filter">
        <mat-label>Status</mat-label>
        <mat-select [value]="statusSelecionado" (selectionChange)="onStatusChange($event.value)">
          @for (s of statusOptions; track s) {
            <mat-option [value]="s">{{ s }}</mat-option>
          }
        </mat-select>
      </mat-form-field>
    }
  </div>
</app-section-card>
