<div class="w-100">
  <ds-field [label]="label" [htmlFor]="inputId" [required]="isRequired" [error]="errorTexto">
    <textarea
      [id]="inputId"
      dsTextarea
      [formControl]="control"
      [rows]="rows"
      [placeholder]="placeholder"
      [attr.maxLength]="maxlength"
      [invalid]="control.invalid && (control.dirty || control.touched)">
    </textarea>
  </ds-field>
</div>
