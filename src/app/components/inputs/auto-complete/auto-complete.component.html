<div class="w-100">
  <mat-label class="f-s-14 f-w-600 m-b-8 d-block">
    {{ label }}
    @if (isRequired) {
      <span style="color: #ff110094">*</span>
    }
  </mat-label>

  <mat-form-field appearance="outline" class="w-100">
    <input
      matInput
      type="text"
      [formControl]="control"
      [matAutocomplete]="auto"
      [placeholder]="placeholder"
      autocomplete="off"
      (focus)="abrirOpcoes()"
      (blur)="updateErrorMessage()" />

    <mat-autocomplete
      #auto="matAutocomplete"
      [displayWith]="displayWith"
      (optionSelected)="aoSelecionar($event.option.value)">

      @for (item of opcoesFiltradas; track item) {
        <mat-option [value]="item">
          {{ displayWith(item) }}
        </mat-option>
      }

      @if (buscaExecutada && opcoesFiltradas.length === 0) {
        <mat-option disabled>
          Nenhum resultado encontrado
        </mat-option>
      }
    </mat-autocomplete>

    @if (control.invalid && control.touched) {
      <mat-error>
        {{ errorMessage() }}
      </mat-error>
    }
  </mat-form-field>
</div>
