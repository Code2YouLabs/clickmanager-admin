<div class="w-100">
  <ds-field [label]="label" [htmlFor]="inputId" [required]="isRequired" [error]="errorTexto">
    <input
      [id]="inputId"
      dsInput
      type="text"
      inputmode="numeric"
      pattern="[0-9]*"
      [formControl]="control"
      [value]="valor"
      [invalid]="control.invalid && control.touched"
      (input)="atualizarValor($event)"
      (keydown)="permitirApenasNumeros($event)" />
  </ds-field>
</div>
