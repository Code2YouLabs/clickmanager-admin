<div class="w-100">
  <ds-field [label]="label" [htmlFor]="inputId" [required]="isRequired" [error]="errorTexto">
    <input
      [id]="inputId"
      dsInput
      type="text"
      [placeholder]="placeholder"
      [maxlength]="maxlength"
      [formControl]="control"
      [invalid]="control.invalid && control.touched"
      (keydown)="onKeydown($event)"
      (input)="onInput($event)"
      (blur)="updateErrorMessage()" />
  </ds-field>
</div>
