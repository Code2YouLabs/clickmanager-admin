<mat-card class="cardWithShadow produto-form">

  <!-- Cabeçalho com botão voltar -->
  <app-card-header
    [titulo]="isEditMode ? 'Editar Produto' : 'Novo Produto'"
    botaoTexto="Voltar"
    botaoIcone="arrow_back"
    [botaoRota]="['/page/cadastro-tecnico/produtos']"
    [mostrarDivisor]="true"
    [helpRota]="['/page/ajuda']"
    helpFragment="pedidos"
    helpTexto="Manual do Produto"
    helpIcone="help_outline">
  </app-card-header>

  <mat-card-content>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <mat-tab-group
        class="tabs-responsive"
        [selectedIndex]="selectedTabIndex"
        (selectedIndexChange)="onTabIndexChange($event)">

        @for (tab of tabs; track tab) {
          <mat-tab [label]="tab.label">
            <mat-card class="cardWithShadow tab-card">
              <mat-card-content>
                @switch (tab.id) {
                  @case ('geral') {
                    <app-input-texto-restrito class="m-b-16" [control]="nomeControl" label="Nome" placeholder="Digite o nome do produto">
                    </app-input-texto-restrito>
                    <app-input-texto-restrito class="m-b-16" [control]="descricaoControl" label="Descrição"
                      placeholder="Digite uma descrição do produto">
                    </app-input-texto-restrito>
                  }
                  @case ('politica-revenda') {
                    <app-politica-revenda [formGroup]="form" [value]="politicaDoProduto"
                      (valueChange)="onPoliticaChange($event)">
                    </app-politica-revenda>
                  }
                  @case ('variacoes') {
                    <app-variacoes-produto [variacoesIniciais]="variacoesIniciais" [politicaProduto]="politicaDoProduto"
                      (variacoesChange)="onVariacoesChange($event)">
                    </app-variacoes-produto>
                  }
                  @case ('calculadora-materiais') {
                    <app-calculadora-materiais [produtoId]="produtoId">
                    </app-calculadora-materiais>
                  }
                }
              </mat-card-content>
            </mat-card>
          </mat-tab>
        }

      </mat-tab-group>

      <!-- Botões -->
      <div class="actions m-t-24">

        <!-- CANCELAR -->
        <button mat-flat-button class="bg-error text-white" type="button"
          [routerLink]="['/page/cadastro-tecnico/produtos']">
          Cancelar
        </button>

        <button mat-stroked-button color="primary" type="button" [disabled]="isFirstTab" (click)="previousTab()">
          Anterior
        </button>

        <button mat-stroked-button color="primary" type="button" [disabled]="isLastTab" (click)="nextTab()">
          Próximo
        </button>

        <!-- SALVAR -->
        <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || loading">
          {{ isEditMode ? 'Atualizar' : 'Salvar' }}
        </button>

      </div>

    </form>

  </mat-card-content>

</mat-card>
